<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cheetah Capture - 视频截帧和音轨检测工具</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
        }

        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 28px;
        }

        .subtitle {
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }

        .control-panel {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 500;
        }

        .file-input-wrapper {
            position: relative;
            display: inline-block;
            width: 100%;
        }

        input[type="file"] {
            display: none;
        }

        .file-input-label {
            display: block;
            padding: 12px 20px;
            background: white;
            border: 2px dashed #667eea;
            border-radius: 8px;
            cursor: pointer;
            text-align: center;
            transition: all 0.3s;
            color: #667eea;
            font-weight: 500;
        }

        .file-input-label:hover {
            background: #f0f4ff;
            border-color: #5568d3;
        }

        .file-input-label.has-file {
            border-style: solid;
            background: #f0f4ff;
        }

        input[type="number"] {
            width: 100%;
            padding: 10px 15px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 14px;
        }

        .button-group {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        button {
            flex: 1;
            padding: 12px 24px;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s;
            color: white;
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        #js_button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        #js_button:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        #js_audio_check {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
        }

        #js_audio_check:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(245, 87, 108, 0.4);
        }

        .info-panel {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 15px;
            min-height: 50px;
        }

        .info-panel:empty::before {
            content: '等待操作...';
            color: #999;
        }

        .supported-formats {
            margin-top: 10px;
            padding: 10px;
            background: #fff3cd;
            border-radius: 6px;
            font-size: 12px;
            color: #856404;
        }

        .result-container {
            margin-top: 20px;
        }

        .result-container h3 {
            margin-bottom: 15px;
            color: #333;
        }

        .image-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 15px;
            margin-top: 15px;
        }

        .image-grid img {
            width: 100%;
            height: auto;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s;
        }

        .image-grid img:hover {
            transform: scale(1.05);
        }

        .image-wrapper {
            position: relative;
            display: inline-block;
        }

        .image-badge {
            position: absolute;
            top: 8px;
            left: 8px;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: 500;
            z-index: 1;
        }

        .sampling-info {
            background: #fff3cd;
            border-left: 4px solid #ffc107;
            padding: 12px;
            margin-bottom: 15px;
            border-radius: 4px;
            color: #856404;
            font-size: 14px;
        }

        .sampling-info strong {
            color: #856404;
        }

        .success-text {
            color: #28a745;
            font-weight: 500;
        }

        .error-text {
            color: #dc3545;
            font-weight: 500;
        }

        .warning-text {
            color: #ffc107;
            font-weight: 500;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>🎬 Cheetah Capture</h1>
        <p class="subtitle">视频截帧和音轨检测工具</p>

        <div class="control-panel">
            <div class="form-group">
                <label for="js_file">选择视频文件</label>
                <div class="file-input-wrapper">
                    <input 
                        id="js_file" 
                        type="file" 
                        accept="video/mp4,video/quicktime,video/x-msvideo,video/webm,video/x-matroska,video/x-flv,video/x-ms-wmv,.mp4,.mov,.avi,.webm,.mkv,.flv,.wmv,.m4v,.3gp,.mpg,.mpeg" 
                        multiple>
                    <label for="js_file" class="file-input-label" id="js_file_label">
                        📁 点击选择视频文件（支持多选）
                    </label>
                </div>
                <div class="supported-formats">
                    <strong>支持的格式：</strong>MP4, MOV, AVI, WebM, MKV, FLV, WMV, M4V, 3GP, MPG, MPEG
                </div>
            </div>

            <div class="form-group">
                <label for="js_time">截取帧数</label>
                <input id="js_time" type="number" value="5" min="1" max="1000" placeholder="输入要截取的帧数（1-1000）">
                <div style="margin-top: 8px; font-size: 12px; color: #666;">
                    💡 提示：超过 200 帧时会自动采样展示（显示约 1/10），避免页面卡顿
                </div>
            </div>

            <div class="button-group">
                <button id="js_button" disabled>🎞️ 提取视频帧</button>
                <button id="js_audio_check" disabled>🔊 检测音轨</button>
            </div>
        </div>

        <div class="info-panel" id="js_info"></div>

        <div class="info-panel" id="js_audio_info"></div>

        <div class="result-container" id="js_result_container" style="display: none;">
            <h3>截取结果</h3>
            <div id="js_sampling_info"></div>
            <div class="image-grid" id="js_result"></div>
        </div>
    </div>

    <script src="../dist/index.js" type="application/javascript"></script>
    <script>
        // 添加时间戳防止浏览器缓存
        const timestamp = Date.now();
        const workerPath = '../dist/capture.worker.js?v=' + timestamp;
        const wasmPath = '../dist/capture.worker.wasm?v=' + timestamp;
        
        // DOM 元素
        const button = document.querySelector('#js_button');
        const audioCheckButton = document.querySelector('#js_audio_check');
        const resultContainer = document.querySelector('#js_result');
        const resultContainerWrapper = document.querySelector('#js_result_container');
        const fileInput = document.querySelector('#js_file');
        const fileLabel = document.querySelector('#js_file_label');
        const infoContainer = document.querySelector('#js_info');
        const audioInfoContainer = document.querySelector('#js_audio_info');
        const timeInput = document.querySelector('#js_time');
        const samplingInfoContainer = document.querySelector('#js_sampling_info');

        // 初始化 Cheetah Capture
        console.log('开始初始化 Cheetah Capture...');
        console.log('Worker 路径:', workerPath);
        console.log('WASM 路径:', wasmPath);
        console.log('完整 Worker URL:', new URL(workerPath, window.location.href).href);
        console.log('完整 WASM URL:', new URL(wasmPath, window.location.href).href);
        
        // 显示就绪状态
        infoContainer.innerHTML = '<span class="success-text">✅ 已就绪，请选择视频文件开始使用</span>';

        // 文件选择监听
        fileInput.addEventListener('change', (e) => {
            const files = e.target.files;
            if (files.length > 0) {
                // 更新文件标签显示
                const fileNames = Array.from(files).map(f => f.name).join(', ');
                fileLabel.innerHTML = `✅ 已选择 ${files.length} 个文件：<br><small>${fileNames.length > 100 ? fileNames.substring(0, 100) + '...' : fileNames}</small>`;
                fileLabel.classList.add('has-file');
                
                // 启用按钮
                button.disabled = false;
                audioCheckButton.disabled = false;
                
                // 清空之前的结果
                infoContainer.innerHTML = '';
                audioInfoContainer.innerHTML = '';
            } else {
                fileLabel.innerHTML = '📁 点击选择视频文件（支持多选）';
                fileLabel.classList.remove('has-file');
                button.disabled = true;
                audioCheckButton.disabled = true;
            }
        });

        // 音轨检测功能
        audioCheckButton.addEventListener('click', async () => {
            console.log('🔊 点击音轨检测按钮');
            
            const files = fileInput.files;
            if (files.length === 0) {
                audioInfoContainer.innerHTML = '<span class="warning-text">⚠️ 请先选择视频文件</span>';
                return;
            }
            
            // 禁用按钮防止重复点击
            audioCheckButton.disabled = true;
            button.disabled = true;
            
            audioInfoContainer.innerHTML = '🔍 正在检测音轨...';
            const file = files[0];
            console.log('准备检测文件:', file.name);
            
            // 创建新的 Worker 实例
            let res;
            try {
                console.log('🔄 创建新的 Capture 实例...');
                const captureInstance = cheetahCapture.initCapture({
                    workerPath,
                    wasmPath,
                });
                res = await captureInstance;
                console.log('✅ Capture 实例创建成功');
            } catch (error) {
                console.error('❌ 创建 Capture 实例失败:', error);
                audioInfoContainer.innerHTML = '<span class="error-text">❌ 初始化失败: ' + error.message + '</span>';
                audioCheckButton.disabled = false;
                button.disabled = false;
                return;
            }
            
            try {
                // 先挂载文件
                console.log('开始挂载文件...');
                await new Promise((resolve, reject) => {
                    // 设置超时
                    const timeout = setTimeout(() => {
                        reject(new Error('挂载文件超时（30秒）'));
                    }, 30000);
                    
                    res.mountFile({
                        file,
                        onSuccess: () => {
                            clearTimeout(timeout);
                            console.log('✅ 挂载文件成功，开始检测音轨');
                            // 挂载成功后检测音轨
                            try {
                                res.hasAudioTrack({
                                onSuccess: (hasAudio) => {
                                    console.log('✅ 音轨检测结果:', hasAudio);
                                    audioInfoContainer.innerHTML = hasAudio 
                                        ? '<span class="success-text">✅ 该视频包含音轨</span>' 
                                        : '<span class="warning-text">⚠️ 该视频不包含音轨（静音视频）</span>';
                                    
                                    // 检测完成后释放资源
                                    res.free({
                                        onSuccess: () => {
                                            console.log('✅ 资源释放成功');
                                            res.terminate();
                                            console.log('🔚 Worker 已终止');
                                            resolve();
                                        }
                                    });
                                },
                                onError: (error) => {
                                    clearTimeout(timeout);
                                    console.error('❌ 检测音轨失败:', error);
                                    audioInfoContainer.innerHTML = '<span class="error-text">❌ 检测音轨失败: ' + error + '</span>';
                                    res.terminate();
                                    reject(error);
                                }
                            });
                            } catch (error) {
                                console.error('❌ 检测音轨出错:', error);
                                audioInfoContainer.innerHTML = '<span class="error-text">❌ 检测音轨失败: ' + error + '</span>';
                                res.terminate();
                                reject(error);
                            }
                        },
                        onError: (error) => {
                            clearTimeout(timeout);
                            console.error('❌ 挂载文件失败:', error);
                            audioInfoContainer.innerHTML = '<span class="error-text">❌ 挂载文件失败: ' + error + '</span>';
                            res.terminate();
                            reject(error);
                        }
                    });
                });
            } catch (error) {
                console.error('❌ 音轨检测出错:', error);
                audioInfoContainer.innerHTML = '<span class="error-text">❌ ' + error.message + '</span>';
                // 确保即使异常也终止 Worker
                if (res && res.terminate) {
                    res.terminate();
                }
            } finally {
                // 恢复按钮状态
                audioCheckButton.disabled = false;
                button.disabled = false;
            }
        });

        button.addEventListener('click', async () => {
            console.log('🎞️ 点击提取视频帧按钮');
            
            const files = fileInput.files;
            if (files.length === 0) {
                infoContainer.innerHTML = '<span class="warning-text">⚠️ 请先选择视频文件</span>';
                return;
            }
            
            const captureTimes = parseInt(timeInput.value, 10);
            if (isNaN(captureTimes) || captureTimes < 1 || captureTimes > 1000) {
                infoContainer.innerHTML = '<span class="error-text">❌ 请输入有效的帧数（1-1000）</span>';
                return;
            }
            
            // 智能采样策略：超过 200 帧时，只展示约 1/10
            const SAMPLING_THRESHOLD = 200;
            const shouldSample = captureTimes > SAMPLING_THRESHOLD;
            const samplingRate = shouldSample ? Math.ceil(captureTimes / Math.min(captureTimes / 10, 100)) : 1;
            const estimatedDisplayCount = shouldSample ? Math.ceil(captureTimes / samplingRate) : captureTimes;
            
            console.log(`📊 采样策略: 总帧数=${captureTimes}, 采样率=${samplingRate}, 预计展示=${estimatedDisplayCount} 帧`);
            
            console.log(`准备提取 ${files.length} 个文件，每个文件 ${captureTimes} 帧`);
            
            // 禁用按钮防止重复点击
            button.disabled = true;
            audioCheckButton.disabled = true;
            
            // 清空之前的结果
            resultContainer.innerHTML = '';
            samplingInfoContainer.innerHTML = '';
            resultContainerWrapper.style.display = 'block';
            audioInfoContainer.innerHTML = '';
            
            // 显示采样提示
            if (shouldSample) {
                samplingInfoContainer.innerHTML = `
                    <div class="sampling-info">
                        🎯 <strong>智能采样模式已启用</strong><br>
                        总帧数：${captureTimes} 帧 | 采样间隔：每 ${samplingRate} 帧取 1 帧 | 预计展示：约 ${estimatedDisplayCount} 帧<br>
                        这样可以避免页面卡顿，同时仍能预览关键画面
                    </div>
                `;
            }
            
            for (let i = 0; i < files.length; i++) {
                const file = files[i];
                const startTime = Date.now();
                
                console.log(`\n━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━`);
                console.log(`📊 开始处理文件 ${i + 1}/${files.length}:`, file.name);
                infoContainer.innerHTML = `📊 正在处理文件 ${i + 1}/${files.length}: <strong>${file.name}</strong><br>⏳ 初始化 Worker...`;
                
                let res;
                try {
                    console.log('🔄 创建新的 Capture 实例...');
                    const captureInstance = cheetahCapture.initCapture({
                        workerPath,
                        wasmPath,
                        onReady: () => {
                            console.log('✅ Worker 就绪');
                        },
                    });
                    res = await captureInstance;
                    console.log('✅ Capture 实例创建成功');
                } catch (error) {
                    console.error('❌ 创建 Capture 实例失败:', error);
                    infoContainer.innerHTML = `<span class="error-text">❌ 文件 ${i + 1} 初始化失败: ${error.message}</span>`;
                    continue;
                }
                
                try {
                    await new Promise((resolve, reject) => {
                        // 设置超时
                        const timeout = setTimeout(() => {
                            reject(new Error('处理超时（60秒）'));
                        }, 60000);
                        
                        // 使用改造后的 mountFile API，只传 file 参数
                        console.log('开始挂载文件...');
                        infoContainer.innerHTML = `📊 正在处理文件 ${i + 1}/${files.length}: <strong>${file.name}</strong><br>⏳ 挂载文件中...`;
                        console.log(`📊 内存监控 - 开始前: ${(performance.memory.usedJSHeapSize / 1024 / 1024).toFixed(2)} MB`);
                        
                        // 存储当前文件的所有 base64 URL，用于后续清理
                        const currentFileUrls = [];
                        
                        res.mountFile({
                            file, // path 参数已经变成可选的，默认为 '/working'
                            onSuccess: () => {
                                clearTimeout(timeout);
                                console.log('✅ 挂载文件成功，开始截帧');
                                infoContainer.innerHTML = `📊 正在处理文件 ${i + 1}/${files.length}: <strong>${file.name}</strong><br>🎬 正在提取视频帧...`;
                                res.getMetadata({
                                    info: 'minor_version',
                                    onSuccess: data => {
                                        if (data) {
                                           console.log('=====>meta change', data)
                                        }
                                    },
                                });
                                let frameCount = 0;
                                let displayedCount = 0;
                                res.capture({
                                    info: captureTimes,
                                    onChange: (list = {}, now = {}, info = {}) => {
                                        console.log(`✅ 收到第 ${frameCount + 1} 帧`);
                                        const { width, height, duration } = info;
                                        frameCount++;
                                        
                                        // 智能采样：只显示部分帧
                                        const shouldDisplay = !shouldSample || (frameCount % samplingRate === 1) || frameCount === captureTimes;
                                        
                                        if (shouldDisplay) {
                                            displayedCount++;
                                            
                                            // 保存 URL 引用用于后续清理
                                            currentFileUrls.push(now.url);
                                            
                                            // 创建图片容器
                                            const wrapper = document.createElement('div');
                                            wrapper.className = 'image-wrapper';
                                            
                                            // 创建标签显示帧序号
                                            const badge = document.createElement('div');
                                            badge.className = 'image-badge';
                                            badge.textContent = shouldSample 
                                                ? `${frameCount}/${captureTimes}` 
                                                : `${frameCount}`;
                                            
                                            const img = document.createElement('img');
                                            img.src = now.url;
                                            img.title = `帧 ${frameCount}/${captureTimes} - ${file.name}`;
                                            img.dataset.frameIndex = frameCount;
                                            
                                            wrapper.appendChild(badge);
                                            wrapper.appendChild(img);
                                            resultContainer.appendChild(wrapper);
                                            
                                            console.log(`📺 显示第 ${displayedCount} 张图片（帧 ${frameCount}/${captureTimes}）`);
                                        } else {
                                            console.log(`⏭️ 跳过第 ${frameCount} 帧（采样）`);
                                            // 不显示的帧立即释放 URL
                                            if (now.url) {
                                                URL.revokeObjectURL(now.url);
                                            }
                                        }

                                        infoContainer.innerHTML = `
                                            📊 正在处理文件 ${i + 1}/${files.length}: <strong>${file.name}</strong><br>
                                            ⏱️ 耗时：${Date.now() - startTime}ms<br>
                                            📐 尺寸：${width} × ${height}<br>
                                            ⏲️ 时长：${duration.toFixed(2)}s<br>
                                            🎞️ 进度：${frameCount}/${captureTimes} 帧${shouldSample ? ` (已展示 ${displayedCount} 帧)` : ''}
                                        `;
                                    },
                                    onSuccess: (list) => {
                                        console.log(`✅ 文件 ${i + 1} 截帧完成，共 ${frameCount} 帧`);
                                        console.log(`📊 内存监控 - 释放前: ${(performance.memory.usedJSHeapSize / 1024 / 1024).toFixed(2)} MB`);
                                        
                                        infoContainer.innerHTML = `
                                            <span class="success-text">✅ 文件 ${i + 1}/${files.length} 处理完成: ${file.name}</span><br>
                                            ⏱️ 总耗时：${Date.now() - startTime}ms<br>
                                            🎞️ 已提取：${frameCount} 帧${shouldSample ? ` (展示 ${displayedCount} 帧)` : ''}
                                        `;
                                        
                                        res.free({
                                            onSuccess: () => {
                                                console.log('✅ 资源释放成功');
                                                console.log(`📊 内存监控 - 释放后: ${(performance.memory.usedJSHeapSize / 1024 / 1024).toFixed(2)} MB`);
                                                
                                                // 清空 URL 引用数组，帮助 GC 回收
                                                currentFileUrls.length = 0;
                                                
                                                res.terminate();
                                                console.log('🔚 Worker 已终止，所有资源已释放');
                                                
                                                // 延迟检查内存释放情况（给 GC 一些时间）
                                                setTimeout(() => {
                                                    console.log(`📊 内存监控 - Worker终止后: ${(performance.memory.usedJSHeapSize / 1024 / 1024).toFixed(2)} MB`);
                                                    console.log(`━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━\n`);
                                                }, 1000);
                                                
                                                resolve();
                                            }
                                        });
                                    },
                                    onError: (error) => {
                                        clearTimeout(timeout);
                                        console.error('❌ 截帧失败:', error);
                                        infoContainer.innerHTML = `<span class="error-text">❌ 截帧失败: ${error}</span>`;
                                        // 清理已创建的 URL 引用
                                        currentFileUrls.length = 0;
                                        // 错误时也终止 Worker
                                        res.terminate();
                                        reject(error);
                                    }
                                });
                            },
                            onError: (error) => {
                                clearTimeout(timeout);
                                console.error('❌ 挂载文件失败:', error);
                                infoContainer.innerHTML = `<span class="error-text">❌ 挂载文件失败: ${error}</span>`;
                                // 挂载失败时也终止 Worker
                                res.terminate();
                                reject(error);
                            }
                        });
                    });
                } catch (error) {
                    console.error('❌ 处理文件出错:', error);
                    infoContainer.innerHTML = `<span class="error-text">❌ 处理文件失败: ${error.message}</span>`;
                    // 确保即使异常也终止 Worker
                    if (res && res.terminate) {
                        res.terminate();
                    }
                    break;
                }
            }
            
            // 所有文件处理完成后恢复按钮
            button.disabled = false;
            audioCheckButton.disabled = false;
            
            if (files.length > 1) {
                infoContainer.innerHTML = `<span class="success-text">🎉 全部完成！共处理 ${files.length} 个文件</span>`;
            }
        });
    </script>
</body>

</html>
